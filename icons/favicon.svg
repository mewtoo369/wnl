<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#c1121f" />
    </linearGradient>
    <linearGradient id="gradBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#gradBody)" filter="url(#shadow)" />

  <!-- Calendar Header Band -->
  <path d="M 32 136 C 32 78.5 78.5 32 136 32 L 376 32 C 433.5 32 480 78.5 480 136 L 480 156 L 32 156 Z" fill="url(#gradHeader)" />

  <!-- Calendar Binding Rings / Holes -->
  <circle cx="140" cy="94" r="14" fill="#ffffff" opacity="0.9" />
  <circle cx="372" cy="94" r="14" fill="#ffffff" opacity="0.9" />
  <rect x="133" y="24" width="14" height="44" rx="7" fill="#8e8e93" />
  <rect x="365" y="24" width="14" height="44" rx="7" fill="#8e8e93" />

  <!-- Main Chinese Character "历" -->
  <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="200" font-weight="bold" fill="#1c1c1e" text-anchor="middle">历</text>

  <!-- Traditional Seal Stamp (万年) -->
  <rect x="330" y="375" width="64" height="64" rx="12" fill="#c1121f" opacity="0.85" />
  <text x="362" y="416" font-family="'PingFang SC', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">吉</text>
</svg>
